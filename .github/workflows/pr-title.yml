name: PR title

# Release versions are picked from pull request titles, so every title must start with a type.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|test|ci|style|refactor|build)(\([^)]+\))?!?: .+'; then
            echo "::error::PR title must start with feat:, fix:, docs:, chore:, test:, ci:, style:, refactor: or build: (feat!: for a breaking change)"
            exit 1
          fi
