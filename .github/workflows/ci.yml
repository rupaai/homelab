name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - name: Docker end-to-end test
        run: make test-docker
      - name: Builds for the Mac and for Linux
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/homelabd
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/homelabd

  services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Rust targets
        run: |
          rustup component add rustfmt clippy && rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          pip install ziglang==0.17.0 cargo-zigbuild
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: End-to-end with homelabd
        run: |
          cargo build --locked --release
          cd .. && HOMELAB_SERVICES_BIN=$PWD/services/target/release/homelab-services go test ./internal/adapters/services -run Integration -v
      - name: Builds for the device (static Linux, amd64 and arm64)
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl

  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
