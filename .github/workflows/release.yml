name: Release

# Every change merged to main that needs one becomes a release with a version (vX.Y.Z, picked
# from the pull request titles by `homelab-services release`) and the program for the device,
# the Mac and arm64 Linux. Homelab on the device updates itself from these. A merge of only
# docs, chore, test, ci, style, refactor or build changes makes no release. The checks run once,
# in ci.yml. This workflow starts when CI has finished on main, and publishes only if CI passed,
# in one step with the programs. (A newer push cancels the CI run of an older one; that one makes
# no release, and its changes go out with the next.)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      # The commit CI checked. GITHUB_SHA is the newest commit of main, which may be later.
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build the release tool
        working-directory: services
        run: cargo build --release --locked
      - name: Pick the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! VERSION=$(services/target/release/homelab-services release prod --repo "$GITHUB_REPOSITORY" --commit "$SHA" --first v0.20.0 --dry-run 2>raw-notes.txt); then
            cat raw-notes.txt >&2
            exit 1
          fi
          cat raw-notes.txt
          if [ -z "$VERSION" ]; then
            echo "No release for this change."
            exit 0
          fi
          # Keep only the notes: drop the tool's own messages.
          grep -v -e '^Dry run: ' -e ' is already made for this commit\.$' raw-notes.txt > notes.md || true
          printf '\nBuilt from %s. On the device, update from the companion (Resources). For a first install see docs/history/milestone6.md.\n' "${SHA::7}" >> notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the programs
        if: steps.version.outputs.version != ''
        uses: ./.github/actions/build-dist
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --target "$SHA" --title "$VERSION" --notes-file notes.md
