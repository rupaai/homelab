name: Release

# Every change merged to main becomes a numbered release (build-<n>) with the program for
# the device, the Mac and arm64 Linux. Homelab on the device updates itself from these.
# The release is only published when the checks pass.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust targets for homelab-services
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          pip install ziglang==0.17.0 cargo-zigbuild
      - name: Build the companion
        working-directory: web
        run: npm ci && npm run check && npm test && npm run build
      - name: Check the Go code
        run: make check
      - name: Build homelabd
        run: scripts/build-release.sh "$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. On the device, update from the companion (Resources). For a first install see docs/milestone6.md."
