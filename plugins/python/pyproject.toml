[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-sdk"
version = "0.1.0"
description = "Python client for the Homelab Files API (standard library only)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/rupaai/homelab"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.9"
