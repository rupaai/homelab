[package]
name = "homelab-services"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures-util = "0.3.34"
hex = "0.4.3"
imagesize = "0.15.0"
infer = "0.22.0"
libc = "0.2.191"
lofty = "0.25.4"
lopdf = { version = "0.46.0", default-features = false }
nom-exif = "3.8.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time", "sync"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ulid = "3.0.0"
zeroize = "1.9.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
