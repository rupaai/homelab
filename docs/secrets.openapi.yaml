openapi: 3.1.0
info:
  title: Homelab Secrets API
  version: "1.0"
  summary: Secrets an app keeps for itself while it runs.
  description: |
    Save, read and delete an app's own secrets, such as the sign-in token of one of its
    users. Every call needs the app's key (`HOMELAB_TOKEN`).

    **Base URL.** `HOMELAB_API_URL`, the app door (`http://host.docker.internal:7085`).
    Only an app key can use this API. An admin key, or a signed-in person, gets 403.

    **Scopes.** `secrets:read` lists and reads. `secrets:write` saves and deletes. Every app
    key has `secrets:read`. It also has `secrets:write` when `homelab.yaml` says
    `secrets_api: write`. With `secrets_api: none` the key has neither. A key made before
    this API existed gets its scopes at the next deploy.

    **Whose secrets.** An app sees only its own app and environment (dev and prod are
    separate). It never sees Homelab's own credentials, and names starting with `HOMELAB_`
    do not exist for it.

    **Two kinds.** The secrets the owner sets in the companion (`config`) can be read
    here, but never changed or deleted. The secrets the app saves here (`app`) are
    kept apart, and are never put in the app's environment. A name is one kind or the
    other in an environment, never both.

    **Limits.** A name is 1 to 200 characters from `A-Z a-z 0-9 _ . : -`. A value is at most
    64 KiB. An app can keep 10000 secrets per environment. The last 5 values of each
    secret are kept.

    **Times** are unix seconds (integers).

    **Errors.** A failed call answers with a status and `{"error": "A sentence."}`. The
    message never contains a secret value.
servers:
  - url: "{HOMELAB_API_URL}"
    description: The value of HOMELAB_API_URL.
    variables:
      HOMELAB_API_URL:
        default: "http://host.docker.internal:7085"
security:
  - apiKey: []
tags:
  - name: Secrets
paths:
  /api/secrets:
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: List your secrets
      description: Names, kinds and versions. Never values. Needs `secrets:read`.
      responses:
        "200":
          description: The secrets of this app and environment, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecretInfo"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/name"
    get:
      tags: [Secrets]
      operationId: getSecret
      summary: Read a secret
      description: Needs `secrets:read`. Add `?version=n` for one of the kept older values.
      parameters:
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The value.
          content:
            application/json:
              schema:
                type: object
                required: [name, value, version]
                properties:
                  name: { type: string }
                  value: { type: string }
                  version: { type: integer }
        "400":
          description: The version is not a number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: There is no such secret, or no such version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [Secrets]
      operationId: putSecret
      summary: Save a secret
      description: |
        Makes the secret or replaces its value with a new version. Needs `secrets:write`.
        A name the owner set in the companion (a `config` secret) is refused with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value: { type: string, maxLength: 65536, description: At most 64 KiB. }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name: { type: string }
                  version: { type: integer }
        "400":
          description: The name or value is not allowed, or the app has too many secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: |
        Needs `secrets:write`. Deleting a secret that is not there is fine. A `config`
        secret cannot be deleted by the app (403).
      responses:
        "204":
          description: Gone.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/secrets/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/name"
    get:
      tags: [Secrets]
      operationId: listSecretVersions
      summary: The kept versions of a secret
      description: The last 5, newest first, without values. Needs `secrets:read`.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, set_at]
                      properties:
                        version: { type: integer }
                        set_at: { type: integer, description: Unix seconds. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: There is no such secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        An app's `HOMELAB_TOKEN` (`hlk_` and 43 characters). It only works at the app door
        (`HOMELAB_API_URL`).
  parameters:
    name:
      name: name
      in: path
      required: true
      description: A secret name, 1 to 200 characters from `A-Z a-z 0-9 _ . : -`.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Unauthorized:
      description: No key, a wrong key, or a revoked key. Comes with `WWW-Authenticate`.
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer realm="homelab"'] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The key is not an app key, or lacks the scope, or the call would change a secret the
        owner set.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The secrets service is not running, or its key is not usable. Try again later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SecretInfo:
      type: object
      required: [name, kind, version, updated_at]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [config, app]
          description: "`config` was set by the owner. `app` was saved by the app."
        version: { type: integer }
        updated_at: { type: integer, description: Unix seconds. }
